# Prose linting for the docs. Run: vale docs README.md
# Rules live in styles/Portfolio and are explained in README.md.
StylesPath = styles
MinAlertLevel = warning
Vocab = Portfolio

[*.md]
BasedOnStyles = Portfolio

# Draft outlines hold prompts for the author, not finished prose.
[docs/case-studies/*.md]
BasedOnStyles =

# Translated pages follow the target language's rules, not these.
[i18n/**/*.md]
BasedOnStyles =

# This page quotes wording to avoid, so the rules it teaches are off for it.
[docs/process/writing-for-translation.md]
Portfolio.Latin = NO
Portfolio.Terms = NO
Portfolio.Wordiness = NO
